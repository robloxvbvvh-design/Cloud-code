<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рыцарь против ситхов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: full-screen game canvas; HUD along the top, thumb controls docked to the bottom corners. */
:root {
  --bg: #04050a;
  --panel: rgba(14, 18, 28, 0.78);
  --line: rgba(255, 255, 255, 0.16);
  --fg: #eceff7;
  --muted: #94a0ba;
  --gold: #e8b85c;
  --red: #ff3b2e;
  --green: #44e08a;
  --font-display: "Rajdhani", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app { position: relative; height: 100%; overflow: hidden; touch-action: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#hud { position: absolute; left: 0; right: 0; top: 0; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.row { display: flex; align-items: center; gap: 12px; }
.lbl { font: 600 12px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.bar { position: relative; height: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.45); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; inset: 0; width: 100%; transform-origin: left center; display: block; }
#hpw { flex: 1; max-width: 300px; }
#hpf { background: linear-gradient(90deg, #c8402e, #f0a14a); }
#bhf { background: linear-gradient(90deg, #8d1010, var(--red)); }
#fps { margin-left: auto; font: 600 12px var(--font-display); letter-spacing: 0.1em; color: var(--muted); }
#obj { font: 600 16px/1.2 var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; text-shadow: 0 1px 6px #000; }

#vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 20, 0.7) 100%); transition: opacity 0.25s; }
#pad { position: absolute; left: 0; top: 18%; bottom: 0; width: 56%; }
#joy { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border: 2px solid var(--line); border-radius: 50%; background: rgba(255, 255, 255, 0.05); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 2px solid rgba(255, 255, 255, 0.5); }
#ctrls { position: absolute; right: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 14px; }
.btn { border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--fg); font: 700 15px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; touch-action: none; backdrop-filter: blur(6px); }
.btn:active, .btn.on { background: rgba(255, 255, 255, 0.22); }
#bAtk { width: 96px; height: 96px; border-color: var(--gold); font-size: 18px; }
#bDash { width: 66px; height: 66px; margin-bottom: 52px; transition: opacity 0.15s; }
#bDash.cd { opacity: 0.35; }
#screen { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at center, rgba(8, 10, 18, 0.72), rgba(3, 4, 8, 0.94)); text-align: center; }

button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
</style>

</head><body>
<main id="app">
  <canvas id="c" aria-label="Игровое поле"></canvas>
  <div id="vig"></div>
  <div id="pad"></div>
  <div id="joy" hidden><i id="knob"></i></div>
  <div id="hud" class="gut">
    <div class="row"><div id="hpw"><span class="lbl">Здоровье</span><div class="bar"><i id="hpf"></i></div></div><span id="fps"></span></div>
    <div id="obj"></div>
    <div id="boss" hidden><span class="lbl">Тёмный лорд</span><div class="bar"><i id="bhf"></i></div></div>
  </div>
  <div id="msg"></div>
  <div id="ctrls" class="gut">
    <button id="bDash" class="btn" type="button">Рывок</button>
    <button id="bAtk" class="btn" type="button">Удар</button>
  </div>
  <section id="screen">
    <div>
      <h1 id="stitle">Рыцарь против ситхов</h1>
      <p id="stext">Пробейтесь через корабль мечом, победите тёмного лорда и улетайте.</p>
      <p class="keys" id="skeys">Левый палец ведёт рыцаря. Кнопка «Удар» бьёт мечом, «Рывок» уворачивается и даёт неуязвимость.</p>
      <button id="go" type="button">Начать</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
